<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 280px; margin: 0; padding: 16px; font: 13px/1.5 -apple-system, 'Segoe UI', system-ui, sans-serif; background: #f4f1ea; color: #1e1b16; }
  h1 { font: 500 17px 'Iowan Old Style', Georgia, serif; margin: 0 0 2px; }
  h1 b { color: #d9531e; font-weight: 600; }
  .state { font: 12px ui-monospace, Menlo, monospace; margin-bottom: 12px; color: #4a453c; }
  .state.connected { color: #2f7a4f; }
  label { display: block; font-size: 12px; color: #4a453c; margin: 8px 0 3px; }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #cfc6b4; border-radius: 6px; font: 12px ui-monospace, Menlo, monospace; }
  .row { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
  button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid #1e1b16; background: #1e1b16; color: #f4f1ea; cursor: pointer; }
  .note { font-size: 11px; color: #8a8375; margin-top: 10px; }
</style>
</head>
<body>
  <h1>Work<b>Flow</b>OS</h1>
  <div id="state" class="state">…</div>
  <label for="token">Pairing token (Settings → Browser extension)</label>
  <input id="token" placeholder="paste token">
  <label for="port">Port</label>
  <input id="port" placeholder="4546">
  <div class="row">
    <button id="save">Save &amp; connect</button>
    <label style="margin:0"><input id="enabled" type="checkbox" style="width:auto"> share activity</label>
  </div>
  <div class="note">Only semantic labels are shared (e.g. "button:Save"), never what you type. Incognito is ignored.</div>
  <script src="popup.js"></script>
</body>
</html>
